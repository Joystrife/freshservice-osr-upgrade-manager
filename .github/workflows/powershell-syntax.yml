name: PowerShell 5.1 syntax validation

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'launcher/**'
      - '.github/workflows/powershell-syntax.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'launcher/**'
      - '.github/workflows/powershell-syntax.yml'

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path .\src -Recurse -File |
            Where-Object { $_.Extension -in @('.ps1', '.psm1') })
          if ($files.Count -lt 3) { throw 'Expected the GUI, worker and core module.' }
          $failures = 0
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              foreach ($errorRecord in $errors) {
                Write-Host ("{0}:{1}: {2}" -f $file.Name, $errorRecord.Extent.StartLineNumber, $errorRecord.Message)
                $failures++
              }
            } else {
              Write-Host ("PASS {0}" -f $file.Name)
            }
          }
          if ($failures -gt 0) { throw "$failures PowerShell syntax error(s) detected." }
      - name: Regression tests - OSR registry discovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-RegistryDiscovery.ps1
      - name: Regression tests - Windows Server Backup provider
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-WindowsBackupProvider.ps1
      - name: Regression tests - same-version lab repair
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-SameVersionRepair.ps1
      - name: Regression tests - Windows Installer metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-MsiMetadata.ps1
      - name: Regression tests - lab file recovery and integrated worker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-LabFiles.ps1
          & .\tests\Test-IntegratedLabWorker.ps1
      - name: Regression tests - lab GUI controls
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-GuiLabMode.ps1
      - name: Regression tests - portable executable
        shell: powershell
        run: .\tests\Test-PortableExecutable.ps1
