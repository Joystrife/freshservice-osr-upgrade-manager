name: Publish 0.5.1 controlled replacement preview

on:
  push:
    branches: ['release/v0.5.1-preview.3']

permissions:
  contents: read

concurrency:
  group: publish-0-5-1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 source and regression suites
        shell: powershell
        run: .\scripts\Test-Release.ps1
      - name: Build and validate source package
        shell: powershell
        run: |
          .\scripts\Build-SourceRelease.ps1
          .\scripts\Build-PortableExecutable.ps1 -OutputDirectory .\dist\portable
          $exe = '.\dist\portable\OSR-Upgrade-Manager-0.5.1-preview.3-portable.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--verify-package' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Native package verification failed.' }
          Copy-Item -LiteralPath $exe -Destination .\dist
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Add-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding ASCII -Value ($hash + '  OSR-Upgrade-Manager-0.5.1-preview.3-portable.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: 0-5-1-release
          path: |
            dist/OSR-Upgrade-Manager-0.5.1-preview.3-source.zip
            dist/OSR-Upgrade-Manager-0.5.1-preview.3-portable.exe
            dist/SHA256SUMS.txt

  publish:
    needs: validate
    if: github.ref == 'refs/heads/release/v0.5.1-preview.3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 0-5-1-release
          path: dist
      - name: Publish experimental source prerelease
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const tag = 'v' + fs.readFileSync('VERSION', 'utf8').trim();
            if (tag !== 'v0.5.1-preview.3') throw new Error('Unexpected release version');
            let tagCommit = null;
            try {
              await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              tagCommit = (await github.rest.repos.getCommit({owner, repo, ref: tag})).data.sha;
            }
            catch (error) { if (error.status !== 404) throw error; }
            if (tagCommit && tagCommit !== context.sha) throw new Error('Refusing to move an existing release tag');
            const docBase = `https://github.com/${owner}/${repo}/blob/${context.sha}/docs/`;
            const body = fs.readFileSync('docs/RELEASE_0_5_1.md', 'utf8')
              .replace(/\]\(([^)]+\.md)\)/g, (_, path) => `](${docBase}${path})`);
            let release = null;
            try { release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (release && !release.draft) {
              if (release.target_commitish !== context.sha) throw new Error('Published release points to a different commit');
              core.info('This source release is already published; no assets changed.');
              return;
            }
            if (!release) release = (await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: '0.5.1-preview.3 - Controlled replacement and application recovery (experimental)',
              body, draft: true, prerelease: true
            })).data;
            for (const name of ['OSR-Upgrade-Manager-0.5.1-preview.3-source.zip', 'OSR-Upgrade-Manager-0.5.1-preview.3-portable.exe', 'SHA256SUMS.txt']) {
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: existing.id});
              const data = fs.readFileSync(`dist/${name}`);
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data,
                headers: {'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain', 'content-length': data.length}});
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id,
              body, draft: false, prerelease: true, make_latest: 'false'});
            core.info(`Published https://github.com/${owner}/${repo}/releases/tag/${tag}`);
